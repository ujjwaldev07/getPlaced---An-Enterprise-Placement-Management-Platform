name: getPlaced  CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  # ==========================================
  # FRONTEND CI
  # ==========================================

  frontend:
    name: Frontend - Install, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Install frontend dependencies
        run: npm ci


      - name: Run frontend tests
        run: npm test -- --run
        continue-on-error: true


      - name: Build frontend
        run: npm run build


  # ==========================================
  # BACKEND CI
  # ==========================================

  backend:
    name: Backend - Install & Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json


      - name: Install backend dependencies
        run: npm ci


      - name: Validate backend syntax
        run: npm run check


      - name: Backend CI completed
        run: echo "Backend validation completed successfully"